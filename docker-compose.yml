services:
  postgres:
    image: postgres:16-alpine
    container_name: schematic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: schematic
    ports:
      - '5432:5432'
    volumes:
      - schematic-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d schematic']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  schematic-postgres-data:
